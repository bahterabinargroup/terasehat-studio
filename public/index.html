<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <title>Terasehat Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="brand-logo">T</div>
        <div>
          <b>Terasehat Pipeline</b>
          <span>Content & Ads Intelligence</span>
        </div>
      </div>

      <div class="pipe-box">
        <div class="pipe-hd">
          <span>NAMA TOKO</span>
          <span class="dot-live">Loop Aktif</span>
        </div>
        <div class="pipe-acct">TeraSehat</div>
        <div class="pipe-sub">TikTok @terasehat2 · TikTok Shop</div>
        <div class="pipe-sub" style="margin-top:6px;color:var(--color-ink)" id="side-sync">Brain: Claude (06, 12, 18, 21 WIB)</div>
      </div>

      <div class="nav-sec">Menu</div>
      <button class="nav-btn active" data-tab="overview">
        <span>Dashboard</span>
        
      </button>
      <button class="nav-btn" data-tab="ranking">
        <span>Ranking Konten & Iklan</span>
        <span class="nav-badge" id="badge-ads-count">6</span>
      </button>
      <button class="nav-btn" data-tab="dna">
        <span>Winning DNA</span>
        
      </button>
      <button class="nav-btn" data-tab="scripts">
        <span>Visual Guide</span>
        <span class="nav-badge" id="badge-script-count">3</span>
      </button>
      <button class="nav-btn" data-tab="checklist">
        <span>Daily Checklist</span>
        <span class="nav-badge" id="badge-chk-count">4</span>
      </button>
      <button class="nav-btn" data-tab="radar">
        <span>Radar Kompetitor</span>
        
      </button>

      <div class="side-foot">
        <div><b>Data:</b> Seller Center + ScrapeCreators</div>
                <div><b>Brain:</b> Claude (jadwal cloud)</div>
        <div><b>Eksekutor:</b> Tim Creator (Manusia)</div>
      </div>
    </aside>

    <main class="main">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Modal Import Seller Center / Detail Konten -->
  <div class="modal-backdrop" id="app-modal">
    <div class="modal" id="app-modal-content"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
